<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>年休管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">年休管理</a>
    <nav>
      <a href="{{ url_for('dashboard') }}">ダッシュボード</a>
      <a href="{{ url_for('employees') }}">従業員</a>
      <a href="{{ url_for('reports.reports') }}">帳票</a>
      <a href="{{ url_for('companies') }}">会社</a>
      <a href="{{ url_for('backup') }}">バックアップ</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="notice">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
